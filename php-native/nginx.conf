# ===========================================================
# 单聊辅助 v1.0 - Nginx 1.31.1 配置示例
# 用法:
#   1. 将本文件复制到 /etc/nginx/conf.d/danchat.conf (或 sites-enabled/)
#   2. 修改 server_name / root / fastcgi_pass
#   3. nginx -t && nginx -s reload
# ===========================================================

# 后端 FastCGI (PHP-FPM 监听 9000 端口 / 或 unix socket)
upstream danchat_php {
    # unix socket 方式 (推荐)
    server unix:/run/php/php8.5-fpm.sock;
    # TCP 方式 (备选)
    # server 127.0.0.1:9000;
}

server {
    listen      80;
    listen      [::]:80;
    # 如需HTTPS请配置 443 并加入 ssl_certificate / ssl_certificate_key
    # listen 443 ssl http2;
    # ssl_certificate     /path/to/fullchain.pem;
    # ssl_certificate_key /path/to/privkey.pem;

    server_name danchat.local _;

    # 站点根目录 = 项目 public 目录
    root  D:/PHP/单聊辅助_php/public;
    # Linux: root /var/www/danchat/public;

    index index.php;
    charset utf-8;

    # 日志
    access_log /var/log/nginx/danchat.access.log;
    error_log  /var/log/nginx/danchat.error.log warn;

    # 客户端上传大小 (与 PHP 一致: 50MB)
    client_max_body_size 50M;
    client_body_buffer_size 128k;

    # 隐藏 PHP 版本
    fastcgi_hide_header X-Powered-By;
    server_tokens off;

    # ================= 静态资源 (Nginx 直接服务) =================
    # 前端 CSS/JS/图片全部由 Nginx 直接返回, 不经 PHP
    location ^~ /static/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
        access_log off;
    }

    # 健康检查
    location = /health {
        fastcgi_pass danchat_php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /health;
    }

    # ================= PHP 处理 =================
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 拒绝访问敏感文件
    location ~ /\.(?!well-known) {
        deny all;
    }
    location ~ ^/(config|src|vendor|install\.php|install\.sql|composer\..*|README\.md) {
        deny all;
    }
    location ~ \.(sql|md|json|lock|yml|yaml|ini|log|sh|env|bak)$ {
        deny all;
    }

    # 拒绝 .php 直接在 /uploads 或 /exports 之外执行
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass   danchat_php;
        fastcgi_index  index.php;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  HTTPS            $https if_not_empty;
        fastcgi_read_timeout 120;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        # 安全: 关闭某些危险函数可在 php.ini 中设置 disable_functions
    }

    # ================= 安全头 =================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # ================= Gzip =================
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
        image/svg+xml;
}

